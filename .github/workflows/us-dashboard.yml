name: US Sector Dashboard Update

on:
  schedule:
    - cron: '7 21 * * 0-5'
    - cron: '23 4 * * 1-6'
    - cron: '17 6 * * 1-6'
  workflow_dispatch:

jobs:
  update-us:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run us_sector_dashboard
        working-directory: ./us_sector_dashboard
        run: python us_sector_dashboard.py
        continue-on-error: true

      - name: Run sector_rotation_dashboard
        working-directory: ./sector_rotation_dashboard
        run: python sector_rotation_dashboard.py
        continue-on-error: true

      - name: Commit and push updated dashboards
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update US dashboards [$(date +'%Y-%m-%d %H:%M')]"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "Push attempt $i failed, retrying..."
              sleep 5
            done
          fi
